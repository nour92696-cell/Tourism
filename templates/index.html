<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tunisie Guide IA</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; display: flex; justify-content: center; padding: 50px; }
        .chat-container { width: 400px; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #e74c3c; color: white; padding: 15px; text-align: center; }
        .chat-box { height: 350px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
        .msg { padding: 8px 12px; border-radius: 15px; max-width: 80%; font-size: 14px; }
        .user { background: #e74c3c; color: white; align-self: flex-end; }
        .bot { background: #eee; color: #333; align-self: flex-start; }
        .input-area { padding: 15px; display: flex; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #e74c3c; color: white; border: none; padding: 8px 15px; margin-left: 5px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header"><h3>Tunisie Guide IA</h3></div>
        <div id="chatbox" class="chat-box">
            <div class="msg bot">Bonjour ! Je suis votre guide. Posez-moi une question sur la Tunisie.</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ecrivez ici...">
            <button onclick="sendMessage()">Envoyer</button>
        </div>
    </div>
<script>
    function sendMessage(){

    const input = document.getElementById("userInput");
    const text = input.value.trim();

    if(text === ""){
        return;
    }

    const chatbox = document.getElementById("chatbox");

   
    chatbox.innerHTML += `
        <div class="msg user">${text}</div>
    `;
    let msg = text.toLowerCase();
    let reply = "";
    if(
        msg.includes("salut") ||
        msg.includes("bonjour") ||
        msg.includes("hello")
    ){
        reply = "Salut 👋 Comment puis-je vous aider à découvrir la Tunisie 🇹🇳 ?";
    }
    else if(
        msg.includes("merci") ||
        msg.includes("thanks")
    ){
        reply = "Avec plaisir 😊 Bon voyage en Tunisie 🇹🇳";
    }
    else if(msg.includes("tunis")){
        reply = "Tunis est la capitale de la Tunisie 🇹🇳. Vous pouvez visiter la médina et Sidi Bou Saïd.";
    }
    else if(msg.includes("sousse")){
        reply = "Sousse possède de magnifiques plages et une médina historique 🌊";
    }
    else if(msg.includes("djerba")){
        reply = "Djerba est une île touristique en tunisie célèbre pour ses hôtels et ses plages 🏝️";
    }
    else if(msg.includes("hotel")){
        reply = "Vous trouverez plusieurs hôtels à Hammamet, Sousse et Djerba 🏨";
    }
    else if(msg.includes("plage")){
        reply = "Les plus belles plages sont à Hammamet, Mahdia et Djerba 🌴";
    }
    else if(msg.includes("restaurant")){
        reply = "La Tunisie possède plusieurs restaurants traditionnels proposant couscous et brik 🍽️";
    }
    else{
        reply = "Désolé 😅 Je suis spécialisé dans le tourisme en Tunisie.";
    }
    setTimeout(() => {
        chatbox.innerHTML += `
            <div class="msg bot">${reply}</div>
        `;
        chatbox.scrollTop = chatbox.scrollHeight;
    }, 500);
    input.value = "";
}
document.getElementById("userInput")
.addEventListener("keypress", function(event){

    if(event.key === "Enter"){
        sendMessage();
    }
});
</script>
</body>
</html>
